<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title> :) TUD (: </title>
    <style>
        body {
            font-family: Arial;
            font-size: 12px;
            margin: 1rem;
            background-color: grey;
            text-align: center;
        }
        textarea {
            width: 70%;
            height: 400px;
            white-space: pre-wrap;
            overflow-x: hidden;
            font-family: Arial;
            font-size: 12px;
            background-color: lightgrey;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .password-box {
            background: lightgrey;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .password-box input {
            padding: .5rem;
            width: 80%;
            font-size: 1rem;
            margin-top: .5rem;
        }
        .password-box button {
            margin-top: 1rem;
            padding: .5rem 1rem;
            font-size: 1rem;
            border: none;
            background-color: grey;
            color: lightgrey;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<h2> :) TUD (: </h2>

<label for="file">Arquivo:</label>
<input type="file" id="file" accept=".enc" /><br><br>

<button onclick="decryptFile()">Descriptografar</button>

<h3>Resultado:</h3>
<textarea id="output" placeholder="O conteúdo do arquivo aparecerá aqui."></textarea>

<script>
    const ITERATIONS = 2085930023;
    const SALT_SIZE = 16;
    const IV_SIZE = 16;
    const KEY_SIZE = 256;

    async function requestPassword() {
        return new Promise((resolve) => {
            const overlay = document.createElement("div");
            overlay.className = "overlay";

            const box = document.createElement("div");
            box.className = "password-box";
            box.innerHTML = `
                    <h3>Digite a senha</h3>
                    <input id="passwordField" type="password" autofocus />
                    <br>
                    <button id="okBtn">OK</button>
                `;

            overlay.appendChild(box);
            document.body.appendChild(overlay);

            const field = document.getElementById("passwordField");
            const btn = document.getElementById("okBtn");

            field.addEventListener("keydown", (e) => {
                if (e.key === "Enter") btn.click();
            });

            btn.onclick = () => {
                const password = field.value.trim();
                document.body.removeChild(overlay);
                resolve(password);
            };
        });
    }

    async function decryptFile() {
        const fileInput = document.getElementById('file');
        const output = document.getElementById('output');

        if (!fileInput.files[0]) {
            alert("Selecione um arquivo .enc");
            return;
        }

        const password = await requestPassword();
        if (!password) {
            alert("Senha não informada.");
            return;
        }

        const fileBuffer = await fileInput.files[0].arrayBuffer();
        const data = new Uint8Array(fileBuffer);

        const salt = data.slice(0, SALT_SIZE);
        const iv = data.slice(SALT_SIZE, SALT_SIZE + IV_SIZE);
        const ciphertext = data.slice(SALT_SIZE + IV_SIZE);

        try {
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw",
                new TextEncoder().encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveKey"]
            );

            const key = await window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: ITERATIONS,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-CBC", length: KEY_SIZE },
                false,
                ["decrypt"]
            );

            const decrypted = await window.crypto.subtle.decrypt(
                { name: "AES-CBC", iv: iv },
                key,
                ciphertext
            );

            const decoder = new TextDecoder("utf-8");
            const plaintext = decoder.decode(decrypted);
            output.value = plaintext;

        } catch (err) {
            alert("Erro ao descriptografar: verifique a senha ou formato do arquivo.");
        }
    }
</script>
</body>
</html>
